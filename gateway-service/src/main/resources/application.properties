server.port=8080

spring.application.name=gateway-service

# ── Security ─────────────────────────────────────────────────────────────────
# This service only validates and routes — it holds no key material and issues
# no tokens of its own. user-service is the real issuer; its public key is
# fetched from this JWKS endpoint and cached automatically.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json

# ── Global filters ───────────────────────────────────────────────────────────────────────────
# Rate limiting (RequestRateLimiter, backed by Redis) was removed for local dev
# to avoid requiring a running Redis instance. Reintroduce it (plus the
# spring-boot-starter-data-redis-reactive dependency and RateLimiterConfig) when
# this needs to run somewhere Redis is actually available.
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedMethods=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].maxAge=3600

# ── Routes ─────────────────────────────────────────────────────────────────────────────────────────
# OpenAPI doc proxy routes: rewrite /v3/api-docs/{service} -> downstream /v3/api-docs
spring.cloud.gateway.server.webflux.routes[0].id=template-service-docs
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/v3/api-docs/template-service
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/v3/api-docs/template-service, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[1].id=ingestion-service-docs
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/v3/api-docs/ingestion-service
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/v3/api-docs/ingestion-service, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[2].id=pipeline-service-docs
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/v3/api-docs/pipeline-service
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/v3/api-docs/pipeline-service, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[3].id=batch-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/v3/api-docs/batch-service
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/v3/api-docs/batch-service, /v3/api-docs

# Service routes (all protected by JWT + circuit breaker)
spring.cloud.gateway.server.webflux.routes[4].id=template-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/v1/api/templates/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.name=template-service
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

spring.cloud.gateway.server.webflux.routes[5].id=ingestion-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/v1/api/ingestion/**
spring.cloud.gateway.server.webflux.routes[5].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.name=ingestion-service
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

spring.cloud.gateway.server.webflux.routes[6].id=pipeline-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/v1/api/pipelines/**
spring.cloud.gateway.server.webflux.routes[6].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.name=pipeline-service
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

spring.cloud.gateway.server.webflux.routes[7].id=batch-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/batch/**
spring.cloud.gateway.server.webflux.routes[7].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.name=batch-service
spring.cloud.gateway.server.webflux.routes[7].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

spring.cloud.gateway.server.webflux.routes[8].id=prediction-forecast
spring.cloud.gateway.server.webflux.routes[8].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/forecast/**
spring.cloud.gateway.server.webflux.routes[8].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[8].filters[0].args.name=prediction-service
spring.cloud.gateway.server.webflux.routes[8].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

spring.cloud.gateway.server.webflux.routes[9].id=prediction-config
spring.cloud.gateway.server.webflux.routes[9].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/config/**
spring.cloud.gateway.server.webflux.routes[9].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[9].filters[0].args.name=prediction-service
spring.cloud.gateway.server.webflux.routes[9].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

spring.cloud.gateway.server.webflux.routes[10].id=prediction-models
spring.cloud.gateway.server.webflux.routes[10].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/models/**
spring.cloud.gateway.server.webflux.routes[10].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[10].filters[0].args.name=prediction-service
spring.cloud.gateway.server.webflux.routes[10].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

# user-service: issues tokens (public) and manages users/companies (protected,
# same JWT-required treatment as every other backend route).
spring.cloud.gateway.server.webflux.routes[11].id=user-service-auth
spring.cloud.gateway.server.webflux.routes[11].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/auth/login
spring.cloud.gateway.server.webflux.routes[11].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.name=user-service
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

spring.cloud.gateway.server.webflux.routes[12].id=user-service-management
spring.cloud.gateway.server.webflux.routes[12].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/api/users/**,/api/companies/**
spring.cloud.gateway.server.webflux.routes[12].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[12].filters[0].args.name=user-service
spring.cloud.gateway.server.webflux.routes[12].filters[0].args.fallbackUri=forward:/fallback/service-unavailable

# ── Resilience4j circuit breakers ────────────────────────────────────────────────────────────────
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=80
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=3s
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=15s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.template-service.baseConfig=default
resilience4j.circuitbreaker.instances.ingestion-service.baseConfig=default
resilience4j.circuitbreaker.instances.pipeline-service.baseConfig=default
resilience4j.circuitbreaker.instances.batch-service.baseConfig=default
resilience4j.circuitbreaker.instances.prediction-service.baseConfig=default
resilience4j.circuitbreaker.instances.user-service.baseConfig=default

# ── Actuator ────────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ── Swagger UI aggregation ─────────────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=template-service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/template-service
springdoc.swagger-ui.urls[1].name=ingestion-service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/ingestion-service
springdoc.swagger-ui.urls[2].name=pipeline-service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/pipeline-service
springdoc.swagger-ui.urls[3].name=batch-service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/batch-service

# ── Logging ─────────────────────────────────────────────────────────────────────────────────────
logging.level.com.uab.salesprevision.gateway=INFO
logging.level.org.springframework.cloud.gateway=WARN
logging.level.io.github.resilience4j=INFO
