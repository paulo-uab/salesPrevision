spring.application.name=user-service
server.port=8086

# Without this, Spring's MessageSource silently falls back to the JVM/OS default
# locale whenever a requested locale has no exact bundle match, overriding the
# configured default (Locale.ENGLISH in I18nConfig) and the caller's Accept-Language.
spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Security ─────────────────────────────────────────────────────────────────
# This service both issues and validates its own tokens, so it points at itself.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json

# ── JWT (RS256) ──────────────────────────────────────────────────────────────
# DEV KEY PAIR -- CHANGE IN PRODUCTION.
# Generate a new pair with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl pkcs8 -topk8 -inform PEM -outform DER -in private.pem -nocrypt | base64 -w0
#   openssl rsa -in private.pem -pubout -outform DER | base64 -w0
app.jwt.key-id=user-service-key-1
app.jwt.private-
app.jwt.public-
app.jwt.expiration-ms=3600000

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [cid:%X{correlationId:-none}] %logger{36} - %msg%n
