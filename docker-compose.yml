services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka:29093,PLAINTEXT://kafka:19092,PLAINTEXT_HOST://0.0.0.0:9092
      # Two listeners, two audiences: PLAINTEXT (19092) is for containers on
      # this same Compose network (e.g. ingestion-service), PLAINTEXT_HOST
      # (9092, mapped to the host) is for anything running directly on your
      # machine outside Docker. Without both, whichever side isn't listed
      # gets handed back an address it can't resolve.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      # "dev" = H2 config (application-dev.properties); "docker" = inter-
      # service URLs pointed at Compose service names instead of localhost.
      # Both active at once — they touch different, non-overlapping properties.
      SPRING_PROFILES_ACTIVE: dev,docker

  template-service:
    build:
      context: .
      dockerfile: template-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
    depends_on:
      - user-service

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - user-service
      - template-service

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
    depends_on:
      - gateway-service
      - kafka

  pipeline-service:
    build:
      context: .
      dockerfile: pipeline-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
    depends_on:
      - gateway-service

  batch-service:
    build:
      context: .
      dockerfile: batch-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev,docker
    depends_on:
      - pipeline-service
      - ingestion-service
      - user-service

  prediction-service:
    build:
      context: ./prediction-service
    ports:
      - "8085:8085"
    environment:
      JWKS_URL: http://user-service:8086/.well-known/jwks.json
    depends_on:
      - user-service
