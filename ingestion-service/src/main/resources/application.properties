spring.application.name=ingestion-service
server.port=8082

# Activates the "dev" profile (application-dev.properties, H2) whenever no
# profile is set explicitly — e.g. via SPRING_PROFILES_ACTIVE=prod on deploy.
spring.profiles.default=dev

# Without this, Spring's MessageSource silently falls back to the JVM/OS default
# locale whenever a requested locale has no exact bundle match, overriding the
# configured default (Locale.ENGLISH in I18nConfig) and the caller's Accept-Language.
spring.messages.fallback-to-system-locale=false

spring.jpa.properties.hibernate.format_sql=true

# ── Security ─────────────────────────────────────────────────────────────────
# Requests must arrive already authenticated (via gateway-service). No key
# material lives here: tokens are verified against the public key user-service
# publishes at this JWKS endpoint (fetched and cached automatically by Spring).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Routed through gateway-service so the call arrives at template-service
# already authenticated. The caller's own Authorization header (and therefore
# their companyId) is relayed onto this call rather than using a separate
# service-account token — see core's TokenRelayAutoConfiguration.
services.template.url=http://localhost:8080
services.template.uri=v1/api/templates/
services.auth.relay=true

app.storage.upload-dir=uploads

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [cid:%X{correlationId:-none}] %logger{36} - %msg%n

# ── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=ingestion-processor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.uab.salesprevision.ingestion.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.uab.salesprevision.ingestion.kafka.IngestionJobEvent

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ── Resilience (calls to template-service) ──────────────────────────────────
# A 404 (ResourceNotFoundException) is a legitimate outcome, never a transient
# failure — excluded from both, so it's never retried and never counts against
# the circuit breaker.
resilience4j.retry.instances.template-service.max-attempts=3
resilience4j.retry.instances.template-service.wait-duration=500ms
resilience4j.retry.instances.template-service.enable-exponential-backoff=true
resilience4j.retry.instances.template-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.template-service.ignore-exceptions=com.uab.core.exception.ResourceNotFoundException

resilience4j.circuitbreaker.instances.template-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.template-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.template-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.template-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.template-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.template-service.ignore-exceptions=com.uab.core.exception.ResourceNotFoundException
