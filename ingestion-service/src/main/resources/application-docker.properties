# ── Docker profile: reach other containers by their Compose service name ────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://user-service:8086/.well-known/jwks.json

# Routed through gateway-service, same as in local dev — just a different
# hostname for it (the Compose service name instead of localhost:8080).
services.template.url=http://gateway-service:8080

spring.kafka.bootstrap-servers=kafka:19092
