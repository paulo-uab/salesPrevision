spring.application.name=template-service
server.port=8081

# Activates the "dev" profile (application-dev.properties, H2) whenever no
# profile is set explicitly — e.g. via SPRING_PROFILES_ACTIVE=prod on deploy.
spring.profiles.default=dev

# Without this, Spring's MessageSource silently falls back to the JVM/OS default
# locale whenever a requested locale has no exact bundle match, overriding the
# configured default (Locale.ENGLISH in I18nConfig) and the caller's Accept-Language.
spring.messages.fallback-to-system-locale=false

spring.jpa.properties.hibernate.format_sql=true

# ── Security ─────────────────────────────────────────────────────────────────
# Requests must arrive already authenticated (via gateway-service). No key
# material lives here: tokens are verified against the public key user-service
# publishes at this JWKS endpoint (fetched and cached automatically by Spring).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [cid:%X{correlationId:-none}] %logger{36} - %msg%n

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

