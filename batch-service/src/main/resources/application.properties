spring.application.name=batch-service
server.port=8084

# Activates the "dev" profile (application-dev.properties, H2) whenever no
# profile is set explicitly — e.g. via SPRING_PROFILES_ACTIVE=prod on deploy.
spring.profiles.default=dev

# Without this, Spring's MessageSource silently falls back to the JVM/OS default
# locale whenever a requested locale has no exact bundle match, overriding the
# configured default (Locale.ENGLISH in I18nConfig) and the caller's Accept-Language.
spring.messages.fallback-to-system-locale=false

spring.jpa.properties.hibernate.format_sql=true

# ── Security ─────────────────────────────────────────────────────────────────
# Requests must arrive already authenticated (via gateway-service). No key
# material lives here: tokens are verified against the public key user-service
# publishes at this JWKS endpoint (fetched and cached automatically by Spring).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json

spring.batch.job.enabled=false

services.pipeline.url=http://localhost:8083
services.pipeline.uri=/v1/api/pipelines/
services.ingestion.url=http://localhost:8082
services.ingestion.uri=/v1/api/ingestion/jobs

# Machine identity for IngestionClient/PipelineClient's cron-triggered calls,
# which have no inbound user request/JWT to derive companyId or auth from
# (see ForecastItemReader/ForecastItemProcessor and PipelineService/IngestionService's
# X-Company-Id trust check). Deliberately NOT services.gateway.* / services.auth.relay —
# those would customize every RestClient in this service, including the one that
# posts to the arbitrary, user-configured prediction API URL.
internal.service.auth-url=http://localhost:8086
internal.service.username=internal-service
internal.service.password=internal-service123

scheduling.enabled=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [cid:%X{correlationId:-none}] %logger{36} - %msg%n

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ── Resilience (calls to pipeline-service and ingestion-service) ───────────
# A 404 (ResourceNotFoundException) on pipeline-service is a legitimate outcome,
# never a transient failure — excluded from both, so it's never retried and
# never counts against the circuit breaker. ingestion-service's client has no
# such carve-out (getCompletedJobs/getRecordsPage never throw a 404 as a normal
# outcome), so its default exception handling applies as-is.
resilience4j.retry.instances.pipeline-service.max-attempts=3
resilience4j.retry.instances.pipeline-service.wait-duration=500ms
resilience4j.retry.instances.pipeline-service.enable-exponential-backoff=true
resilience4j.retry.instances.pipeline-service.exponential-backoff-multiplier=2
resilience4j.retry.instances.pipeline-service.ignore-exceptions=com.uab.core.exception.ResourceNotFoundException

resilience4j.circuitbreaker.instances.pipeline-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.pipeline-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.pipeline-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pipeline-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.pipeline-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.pipeline-service.ignore-exceptions=com.uab.core.exception.ResourceNotFoundException

resilience4j.retry.instances.ingestion-service.max-attempts=3
resilience4j.retry.instances.ingestion-service.wait-duration=500ms
resilience4j.retry.instances.ingestion-service.enable-exponential-backoff=true
resilience4j.retry.instances.ingestion-service.exponential-backoff-multiplier=2

resilience4j.circuitbreaker.instances.ingestion-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.ingestion-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ingestion-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ingestion-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.ingestion-service.permitted-number-of-calls-in-half-open-state=3
