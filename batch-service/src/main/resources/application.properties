spring.application.name=batch-service
server.port=8084

# Without this, Spring's MessageSource silently falls back to the JVM/OS default
# locale whenever a requested locale has no exact bundle match, overriding the
# configured default (Locale.ENGLISH in I18nConfig) and the caller's Accept-Language.
spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:h2:mem:batchdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Security ─────────────────────────────────────────────────────────────────
# Requests must arrive already authenticated (via gateway-service). No key
# material lives here: tokens are verified against the public key user-service
# publishes at this JWKS endpoint (fetched and cached automatically by Spring).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8086/.well-known/jwks.json

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

services.pipeline.url=http://localhost:8083
services.pipeline.uri=/v1/api/pipelines/
services.ingestion.url=http://localhost:8082
services.ingestion.uri=/v1/api/ingestion/jobs

# Machine identity for IngestionClient/PipelineClient's cron-triggered calls,
# which have no inbound user request/JWT to derive companyId or auth from
# (see ForecastItemReader/ForecastItemProcessor and PipelineService/IngestionService's
# X-Company-Id trust check). Deliberately NOT services.gateway.* / services.auth.relay —
# those would customize every RestClient in this service, including the one that
# posts to the arbitrary, user-configured prediction API URL.
internal.service.auth-url=http://localhost:8086
internal.service.username=internal-service
internal.service.password=internal-service123

scheduling.enabled=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [cid:%X{correlationId:-none}] %logger{36} - %msg%n
